# netlify.toml — drop this in the root of your project repo

[build]
  publish = "."       # serve index.html from root
  functions = "netlify/functions"   # on-demand only — nothing in here is scheduled

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
